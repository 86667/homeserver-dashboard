# Included by every location (nginx drops inherited add_header lines in a
# location that sets its own).
#
# connect-src stays open: the page talks to whichever homeserver, pkarr relays
# and HTTP relay it is configured for. 'wasm-unsafe-eval' lets the Pubky SDK
# start its WebAssembly. no-referrer keeps an invite code in the URL from
# leaking to the sites the page links to.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; connect-src 'self' https: http:; img-src 'self' data:; style-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Content-Type-Options "nosniff" always;
