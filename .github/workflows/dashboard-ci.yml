name: Dashboard CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # Keep in sync with the Dockerfile base image (node:24-alpine)
          # and the engines field in package.json.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Knip
        run: npm run knip

      - name: Tests (with coverage)
        run: npm run test:coverage

      - name: Build
        run: npm run bundle

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Only the runtime stage of the arm64 image runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64
          tags: homeserver-dashboard:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The account page (account/) is its own app with its own dependencies.
  # Lint and format are covered by the quality job above.
  account:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: account
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: account/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  account-docker:
    runs-on: ubuntu-latest
    needs: account
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Built from the repository root: the page shares the admin app's UI primitives.
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: account/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: homeserver-account:ci
          cache-from: type=gha,scope=account
          cache-to: type=gha,mode=max,scope=account
